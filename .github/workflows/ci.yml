name: CI

# Not yet enabled/pushed as a live workflow - authored and locally
# validated (YAML syntax + every command run and passing on this
# machine) per the "prepare, don't fabricate" rule for anything
# requiring infrastructure (a real GitHub Actions runner) this
# environment cannot itself provide. Enabling this is the user's call:
# push it to a branch/PR to see it run.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import regression (every module actually imports)
        run: |
          python -c "
          import importlib
          mods = [
              'models', 'training', 'inference', 'data_sources', 'evaluation',
              'tools.financial_calculator', 'rag', 'app.backend.server',
              'ai_platform', 'ai_platform.registry', 'ai_platform.orchestrator',
              'ai_platform.security', 'ai_platform.anomaly', 'ai_platform.forecasting',
              'ai_platform.verification', 'ai_platform.observability', 'ai_platform.health',
              'ai_platform.live_data', 'ai_platform.research', 'ai_platform.fraud',
              'ai_platform.code_sandbox', 'ai_platform.database_ai', 'ai_platform.multilingual',
              'ai_platform.knowledge_graph', 'ai_platform.reranking', 'ai_platform.speech',
              'ai_platform.recommendation', 'ai_platform.model_registry', 'ai_platform.auth',
              'ai_platform.approval', 'ai_platform.agents', 'ai_platform.workflow',
              'rag.persistent_store',
          ]
          failed = []
          for m in mods:
              try:
                  importlib.import_module(m)
              except Exception as e:
                  print(f'FAIL {m}: {e}')
                  failed.append(m)
          print(f'{len(mods) - len(failed)}/{len(mods)} modules imported OK')
          if failed:
              raise SystemExit(f'{len(failed)} module(s) failed to import: {failed}')
          "

      - name: Model forward-pass smoke test (python main.py demo)
        run: python main.py demo

      - name: Financial calculator self-test (15 known formulas)
        run: |
          python -c "
          from tools.financial_calculator import calculate
          r = calculate('ebitda_margin', ebitda=100, revenue=500)
          assert r.value == 20.0, f'expected 20.0, got {r.value}'
          print('calculator self-test PASS')
          "

      - name: AI capability registry loads and reports a real summary
        run: |
          python -c "
          from ai_platform import summary
          s = summary()
          print('registry summary:', s)
          assert sum(s.values()) > 0, 'registry should not be empty'
          "

      - name: Code sandbox self-test (must NOT allow os import)
        run: |
          python -c "
          from ai_platform.code_sandbox import run_python
          r = run_python('print(1+1)')
          assert r.success and r.stdout.strip() == '2'
          r2 = run_python('import os\nos.system(\"echo pwned\")')
          assert r2.rejected_reason is not None, 'sandbox must reject filesystem/process escape attempts'
          print('code sandbox self-test PASS')
          "

  # Training/evaluation are deliberately NOT run in CI - they need a GPU to
  # complete in reasonable time (see notebooks/GPU_Training_Colab.ipynb)
  # and CPU-scale runs here would either be too slow for a CI job or too
  # small to mean anything beyond what the smoke-test job above already
  # covers structurally.
