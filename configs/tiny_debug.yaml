# TINY DEBUG preset — verify the entire pipeline works end to end.
# Never used unless explicitly selected via `--preset tiny_debug`.

name: tiny_debug
description: "Smallest possible run to verify the pipeline works end to end."

train_tokens: 1000000
validation_tokens: 100000
max_steps: 100

# seq_len may be < model block_size (1024). The architecture supports any
# t <= block_size; a shorter sequence keeps this preset runnable on CPU.
# Measured: batch 8 x seq 1024 exhausts memory on CPU (process abort);
# batch 2 x seq 256 completes a full fwd+bwd step in ~7s on CPU.
batch_size: 2
seq_len: 256
gradient_accumulation_steps: 1

learning_rate: 3.0e-4
warmup_steps: 10
min_lr: 1.0e-5

eval_interval: 25
eval_iters: 5

dataset_mix:
  fineweb_edu: 0.40
  financial_text: 0.20
  financial_qa: 0.15
  financial_reports: 0.10
  financial_reasoning: 0.10
  financial_instruction: 0.05
