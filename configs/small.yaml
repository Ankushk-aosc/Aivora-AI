# SMALL preset — first real model experiment.

name: small
description: "First real model experiment."

train_tokens: 10000000
validation_tokens: 500000
max_steps: 2000

# Sized for a GPU. Reduce batch_size / seq_len if you hit OOM.
batch_size: 16
seq_len: 512
gradient_accumulation_steps: 4

learning_rate: 3.0e-4
warmup_steps: 200
min_lr: 1.0e-5

eval_interval: 200
eval_iters: 50

# General-purpose slice (fineweb_edu + general_*) stays at 40% overall, same
# as before - it's now diversified across raw web text, instruction-following,
# dialogue, QA, and reasoning instead of just fineweb_edu alone, so the model
# generalizes beyond finance. The financial slice (60%) is unchanged.
dataset_mix:
  fineweb_edu: 0.20
  general_instruction: 0.05
  general_dialogue: 0.05
  general_qa: 0.05
  general_reasoning: 0.05
  financial_text: 0.20
  financial_qa: 0.15
  financial_reports: 0.10
  financial_reasoning: 0.10
  financial_instruction: 0.05
